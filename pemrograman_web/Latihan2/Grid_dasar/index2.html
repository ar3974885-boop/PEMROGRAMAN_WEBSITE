<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        .box {
            width: 100%;
            padding: 20px;
            background-color: steelblue;
            color: white;
            text-align: center;
        }
        @media (max-width: 768px) {
          .box {
            background-color: darkorange;
          }
        }
        @media (max-width: 480px){
          .box {
            background-color: crimson;
            font-size: 14px;
          }
        }

    </style>
    <meta< charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh implementasi lengkap</title>
</head>
<body>
    <div class="box">Contoh Box Responsif</div>
</body>
</html>
